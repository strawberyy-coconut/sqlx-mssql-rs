[package]
name = "sqlx-mssql-rs-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Core MSSQL driver for SQLx built on Microsoft's mssql-tds TDS implementation."
readme = "../README.md"
keywords = ["sqlx", "mssql", "sql-server", "tds", "database"]
categories = ["database"]
rust-version = "1.96"
documentation = "https://docs.rs/sqlx-mssql-rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
any = ["sqlx-core/any"]
bigdecimal = ["dep:bigdecimal", "sqlx-core/bigdecimal"]
# `BString`/`BStr` support is entirely generic in sqlx-core, delegating to the
# `Vec<u8>`/`[u8]` impls this driver already has.
bstr = ["sqlx-core/bstr"]
chrono = ["dep:chrono", "sqlx-core/chrono"]
time = ["dep:time", "sqlx-core/time"]
decimal = ["rust_decimal"]
json = ["dep:serde_json", "sqlx-core/json"]
migrate = ["sqlx-core/migrate"]
offline = ["sqlx-core/offline", "dep:serde", "dep:sqlx-macros-core"]
rust_decimal = ["dep:rust_decimal", "sqlx-core/rust_decimal"]
spatial = ["dep:geo-types", "dep:geo-traits", "dep:wkb"]
# Parsing of `sqlx.toml`, which drives type overrides and preferred crates.
sqlx-toml = ["sqlx-core/sqlx-toml"]
uuid = ["dep:uuid", "sqlx-core/uuid"]
integrated-auth = ["mssql-tds/integrated-auth"]

[dependencies]
# `mssql-tds` is consumed straight from git; the committed `Cargo.lock` pins the
# exact revision.
mssql-tds = { git = "https://github.com/microsoft/mssql-rs", branch = "main", default-features = false }

async-stream = "0.3.6"
bigdecimal = { version = "0.4.0", optional = true }
chrono = { version = "0.4.34", default-features = false, features = ["std", "clock"], optional = true }
futures-core = { version = "0.3.32", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc"] }
geo-traits = { version = "0.3", optional = true, features = ["geo-types"] }
geo-types = { version = "0.7", optional = true }
log = "0.4.28"
rust_decimal = { version = "1.36.0", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0.219", features = ["derive", "rc"], optional = true }
serde_json = { version = "1.0.142", features = ["raw_value"], optional = true }
sqlx-core = { version = "0.9.0", default-features = false, features = ["_rt-tokio"] }
sqlx-macros-core = { version = "0.9.0", optional = true, features = ["macros"] }
thiserror = "2.0.17"
time = { version = "0.3", optional = true }
tokio = { version = "1.52.3", features = ["rt", "net", "time"] }
url = "2.5.7"
uuid = { version = "1.12.1", optional = true }
wkb = { version = "0.9.2", optional = true }
