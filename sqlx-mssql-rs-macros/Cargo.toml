[package]
name = "sqlx-mssql-rs-macros"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Proc macro support for sqlx-mssql-rs."
readme = "../README.md"
keywords = ["sqlx", "mssql", "sql-server", "tds", "database"]
categories = ["database"]
rust-version = "1.96"
documentation = "https://docs.rs/sqlx-mssql-rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[features]
default = ["macros", "offline"]
macros = ["sqlx-macros-core/macros"]
offline = ["sqlx-mssql-rs-core/offline"]
derive = ["sqlx-macros-core/derive"]
migrate = ["sqlx-macros-core/migrate"]
bigdecimal = ["sqlx-mssql-rs-core/bigdecimal", "sqlx-macros-core/bigdecimal"]
chrono = ["sqlx-mssql-rs-core/chrono", "sqlx-macros-core/chrono"]
# `sqlx-macros-core` has no `jiff` support, so there is nothing to forward to it.
jiff = ["sqlx-mssql-rs-core/jiff"]
json = ["sqlx-mssql-rs-core/json", "sqlx-macros-core/json"]
rust_decimal = ["sqlx-mssql-rs-core/rust_decimal", "sqlx-macros-core/rust_decimal"]
sqlx-toml = ["sqlx-mssql-rs-core/sqlx-toml", "sqlx-macros-core/sqlx-toml"]
time = ["sqlx-mssql-rs-core/time", "sqlx-macros-core/time"]
uuid = ["sqlx-mssql-rs-core/uuid", "sqlx-macros-core/uuid"]

[dependencies]
sqlx-macros-core = { version = "0.9.0", default-features = false }
sqlx-mssql-rs-core = { version = "0.1.0", path = "../sqlx-mssql-rs-core", features = ["offline"] }
proc-macro2 = "1.0.76"
syn = { version = "2.0.58", features = ["full"] }
quote = "1.0.35"
